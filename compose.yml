services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  member:
    build: ./member-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/member_db
      DB_USER: member_app
      DB_PASSWORD: localdev
      JWT_PRIVATE_KEY_PATH: /app/keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public_key.pem
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set_MAIL_USERNAME_in_.env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set_MAIL_PASSWORD_in_.env}
      FRONT_END_URL: ${FRONT_END_URL:-http://localhost:8088}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMS_INTERNAL_TOKEN: ${EMS_INTERNAL_TOKEN:?Set_EMS_INTERNAL_TOKEN_in_.env}
    volumes:
      - ./local-secrets/jwt/private_key.pem:/app/keys/private_key.pem:ro
      - ./local-secrets/jwt/public_key.pem:/app/keys/public_key.pem:ro
    depends_on:
      postgres: {condition: service_healthy}
  event:
    build: ./event-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/event_db
      DB_USER: event_app
      DB_PASSWORD: localdev
      EMS_INTERNAL_TOKEN: ${EMS_INTERNAL_TOKEN:?Set_EMS_INTERNAL_TOKEN_in_.env}
      MEMBER_SERVICE_URL: http://member:8081
    depends_on:
      postgres: {condition: service_healthy}
  interaction:
    build: ./interaction-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/interaction_db
      DB_USER: interaction_app
      DB_PASSWORD: localdev
      JWT_PUBLIC_KEY_PATH: /app/keys/public_key.pem
      EVENT_SERVICE_URL: http://event:8082
      EMS_INTERNAL_TOKEN: ${EMS_INTERNAL_TOKEN:?Set_EMS_INTERNAL_TOKEN_in_.env}
    volumes:
      - ./local-secrets/jwt/public_key.pem:/app/keys/public_key.pem:ro
    depends_on:
      postgres: {condition: service_healthy}
  gateway:
    build: ./gateway
    environment:
      MEMBER_SERVICE_URL: http://member:8081
      EVENT_SERVICE_URL: http://event:8082
      INTERACTION_SERVICE_URL: http://interaction:8083
      INTERACTION_WS_URL: ws://interaction:8083
      JWT_PUBLIC_KEY_PATH: /app/keys/public_key.pem
    volumes:
      - ./local-secrets/jwt/public_key.pem:/app/keys/public_key.pem:ro
    depends_on: [member,event,interaction]
  frontend:
    build: ./frontend
  nginx:
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8088}:80"]
    volumes: ["./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend,gateway]
volumes:
  dbdata:
