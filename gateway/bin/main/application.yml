server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # Member Service
        - id: member
          uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/members/**,/api/oauth2/**,/api/login/oauth2/**
          filters:
            - StripPrefix=1
        # Event Service
        - id: event
          uri: ${EVENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/events/**
          filters:
            - StripPrefix=1
        # Interaction Service - HTTP
        - id: interaction
          uri: ${INTERACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/interactions/**
          filters:
            - StripPrefix=1
        # Interaction Service - WebSocket (신규)
        - id: interaction-websocket
          uri: ${INTERACTION_WS_URL:ws://localhost:8083}
          predicates:
            - Path=/api/ws/interactions
            - Method=GET
          filters:
            - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  public-key: ${JWT_PUBLIC_KEY_PATH}
  issuer: ems-auth
