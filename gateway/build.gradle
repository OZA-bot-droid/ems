plugins { id 'java'; id 'org.springframework.boot' version '3.4.5'; id 'io.spring.dependency-management' version '1.1.7' }
group = 'com.ems'; version = '0.1.0'; java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
ext { set('springCloudVersion', '2024.0.1') }
dependencies { implementation 'org.springframework.cloud:spring-cloud-starter-gateway'; implementation 'org.springframework.boot:spring-boot-starter-actuator'; testImplementation 'org.springframework.boot:spring-boot-starter-test' }
dependencyManagement { imports { mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}" } }
tasks.named('test') { useJUnitPlatform() }
