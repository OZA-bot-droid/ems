name: EMS Communication

on:
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  communication:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_COMMUNICATION }}
          username: "Pull & Request"
          title: "💬 EMS GitHub 소통 알림"
          description: |
            **작성자:** ${{ github.actor }}
            **이벤트:** ${{ github.event_name }}
            **상태:** ${{ github.event.action }}
            **저장소:** ${{ github.repository }}

            🔗 [GitHub에서 확인하기](${{ github.event.review.html_url || github.event.comment.html_url || github.event.pull_request.html_url || github.event.issue.html_url || github.server_url }})
          url: ${{ github.event.review.html_url || github.event.comment.html_url || github.event.pull_request.html_url || github.event.issue.html_url || github.server_url }}
          status: "Success"
          color: "0x5865F2"
          nodetail: true
          nofail: false
