$kind: collection
description: |-
  0\. 서버 확인

  event, session 생성 및 조회, 삭제 확인
variables:
  baseUrl: http://localhost:8082
  adminId: "1"
  userId: "2"
  eventA: ""
  eventB: ""
  eventC: ""
  eventD: ""
  exEventId: ""
  exSessionA: ""
  exSessionB: ""
  regEventId: ""
  sessionA1: ""
scripts:
  - type: http:afterResponse
    code: |-
      // [공통 오류 규격 검사] 모든 요청에 자동 적용: 4xx/5xx 응답이면 7칸이 다 있는지 확인
      if (pm.response.code >= 400 && pm.response.text()) {
        const err = pm.response.json();
        pm.test('[공통] 오류 응답 7칸 (success, code, message, status, timestamp, path, traceId)', () => {
          pm.expect(err).to.have.all.keys('success', 'code', 'message', 'status', 'timestamp', 'path', 'traceId');
        });
        pm.test('[공통] success=false, status = 실제 HTTP 상태', () => {
          pm.expect(err.success).to.eql(false);
          pm.expect(err.status).to.eql(pm.response.code);
        });
        pm.test('[공통] code는 대문자_스네이크, path는 /api로 시작, timestamp는 UTC(Z)', () => {
          pm.expect(err.code).to.match(/^[A-Z][A-Z0-9_]*$/);
          pm.expect(err.path).to.match(/^\/api\//);
          pm.expect(err.timestamp).to.match(/Z$/);
        });
      }
      // [공통 성공 규격 검사] 2xx이고 본문이 있으면 7칸 래퍼인지 확인 (204는 본문 없음)
      if (pm.response.code >= 200 && pm.response.code < 300 && pm.response.code !== 204 && pm.response.text()) {
        const ok = pm.response.json();
        pm.test('[공통] 성공 응답 7칸 (success, data, message, status, timestamp, path, traceId)', () => {
          pm.expect(ok).to.have.all.keys('success', 'data', 'message', 'status', 'timestamp', 'path', 'traceId');
          pm.expect(ok.success).to.eql(true);
          pm.expect(ok.status).to.eql(pm.response.code);
          pm.expect(ok.path).to.match(/^\/api\//);
        });
      }
      if (pm.response.code === 204) {
        pm.test('[공통] 204는 본문 없음', () => pm.expect(pm.response.text()).to.eql(''));
      }
    language: text/javascript
