$kind: http-request
url: "{{baseUrl}}/events/{{eventA}}"
method: GET
headers:
  X-Member-Id: "{{userId}}"
  X-User-Role: USER
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 응답', () => pm.response.to.have.status(200));
      pm.test('링크 숨김', () => pm.expect(pm.response.json().data.meetingUrl).to.eql(null));
    language: text/javascript
order: 4000
