$kind: http-request
url: "{{baseUrl}}/events?page=0&size=10"
method: GET
queryParams:
  page: "0"
  size: "10"
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 응답', () => pm.response.to.have.status(200));
      pm.test('DRAFT 없음', () => pm.expect(pm.response.json().data.content.map(e => e.status)).to.not.include('DRAFT'));
      pm.test('3개', () => pm.expect(pm.response.json().data.totalElements).to.eql(3));
    language: text/javascript
order: 1000
