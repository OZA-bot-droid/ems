$kind: http-request
url: "{{baseUrl}}/events?page=0&size=10"
method: GET
headers:
  X-Member-Id: "{{adminId}}"
  X-User-Role: ADMIN
queryParams:
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 응답', () => pm.response.to.have.status(200));
      pm.test('4개', () => pm.expect(pm.response.json().data.totalElements).to.eql(4));
    language: text/javascript
order: 2000
