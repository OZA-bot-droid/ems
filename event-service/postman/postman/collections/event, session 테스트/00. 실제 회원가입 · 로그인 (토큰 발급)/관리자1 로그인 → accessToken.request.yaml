$kind: http-request
url: "{{baseUrl}}/members/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin1@test.com",
      "password": "test1234!",
      "clientId": "b38defd4-1a08-4070-907e-2a3a2826fca0"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? pm.response.json() : {};

      if (pm.response.code === 200 && json.data?.accessToken) {
          pm.collectionVariables.set(
              "accessToken",
              json.data.accessToken
          );
          pm.variables.set("accessToken", json.data.accessToken);

          console.log("accessToken 저장 완료");
      }
    language: text/javascript
order: 4000
