$kind: http-request
url: "{{baseUrl}}/members/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user1@test.com",
      "password": "test1234!",
      "clientId": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? pm.response.json() : {};

      if (pm.response.code === 200 && json.data?.accessToken) {
          pm.collectionVariables.set(
              "userToken",
              json.data.accessToken
          );
          pm.variables.set("userToken", json.data.accessToken);

          console.log("userToken 저장 완료");
      }
    language: text/javascript
order: 6000
