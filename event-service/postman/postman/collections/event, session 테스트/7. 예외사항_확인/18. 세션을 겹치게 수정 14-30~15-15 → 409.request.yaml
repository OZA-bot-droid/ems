$kind: http-request
name: 18. 세션을 겹치게 수정 14:30~15:15 → 409
url: "{{baseUrl}}/events/{{exEventId}}/sessions/{{exSessionB}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "startsAt": "2027-12-01T05:30:00Z",
      "endsAt": "2027-12-01T06:15:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 응답', () => pm.response.to.have.status(409));
      pm.test('code = SESSION_TIME_CONFLICT', () => pm.expect(pm.response.json().code).to.eql('SESSION_TIME_CONFLICT'));
    language: text/javascript
order: 21000
