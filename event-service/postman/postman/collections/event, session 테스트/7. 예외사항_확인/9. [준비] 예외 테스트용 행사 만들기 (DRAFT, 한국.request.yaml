$kind: http-request
name: 9. [준비] 예외 테스트용 행사 만들기 (DRAFT, 한국 14:00~17:00) → 201
url: "{{baseUrl}}/events"
method: POST
headers:
  Content-Type: application/json
  X-Member-Id: "{{adminId}}"
  X-User-Role: ADMIN
body:
  type: json
  content: |-
    {
      "title": "예외 테스트용 행사",
      "description": "예외 확인 전용",
      "capacity": 30,
      "startsAt": "2027-12-01T05:00:00Z",
      "endsAt": "2027-12-01T08:00:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 응답', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('exEventId', pm.response.json().data.id);
      pm.test('새 행사는 DRAFT', () => pm.expect(pm.response.json().data.status).to.eql('DRAFT'));
    language: text/javascript
order: 9000
