$kind: http-request
url: "{{baseUrl}}/events"
method: POST
headers:
  Content-Type: application/json
  X-Member-Id: "{{adminId}}"
  X-User-Role: ADMIN
body:
  type: json
  content: |-
    {
      "title": "신청자 있는 행사 (삭제 불가 테스트)",
      "description": "참가 신청이 있으면 삭제가 막히는지 확인",
      "capacity": 10,
      "startsAt": "2027-12-02T05:00:00Z",
      "endsAt": "2027-12-02T08:00:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 응답', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('regEventId', pm.response.json().data.id);
      pm.test('새 행사는 DRAFT', () => pm.expect(pm.response.json().data.status).to.eql('DRAFT'));
    language: text/javascript
order: 37000
