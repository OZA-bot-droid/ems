$kind: http-request
name: 26-3. 다른 관리자(3번)가 행사 삭제 → 403 EVENT_OWNER_REQUIRED
url: "{{baseUrl}}/events/{{exEventId}}"
method: DELETE
headers:
  X-Member-Id: "3"
  X-User-Role: ADMIN
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 응답', () => pm.response.to.have.status(403));
      pm.test('code = EVENT_OWNER_REQUIRED', () => pm.expect(pm.response.json().code).to.eql('EVENT_OWNER_REQUIRED'));
    language: text/javascript
order: 33000
