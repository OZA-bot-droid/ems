$kind: http-request
name: 16. 딱 붙는 시간 14:45~15:00 → 201 (겹침 아님)
url: "{{baseUrl}}/events/{{exEventId}}/sessions"
method: POST
headers:
  Content-Type: application/json
  X-Member-Id: "{{adminId}}"
  X-User-Role: ADMIN
body:
  type: json
  content: |-
    {
      "title": "쉬는 시간",
      "startsAt": "2027-12-01T05:45:00Z",
      "endsAt": "2027-12-01T06:00:00Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('201 응답', () => pm.response.to.have.status(201));
    language: text/javascript
order: 19000
