$kind: http-request
url: "{{baseUrl}}/events/{{exEventId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{admin2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 응답', () => pm.response.to.have.status(404));
      pm.test('code = EVENT_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('EVENT_NOT_FOUND'));
    language: text/javascript
order: 15000
