$kind: http-request
name: 14-2. 다른 관리자(3번)의 DRAFT 목록 → 남의 DRAFT 없음
url: "{{baseUrl}}/events?status=DRAFT"
method: GET
queryParams:
  status: DRAFT
auth:
  type: bearer
  credentials:
    token: "{{admin2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 응답', () => pm.response.to.have.status(200));
      pm.test('예외 테스트 행사(exEventId)가 목록에 없음', () => pm.expect(pm.response.json().data.content.map(e => e.id)).to.not.include(Number(pm.collectionVariables.get('exEventId'))));
    language: text/javascript
order: 16000
