$kind: http-request
url: "{{baseUrl}}/events/{{exEventId}}/sessions"
method: POST
headers:
  Content-Type: application/json
  X-Member-Id: "{{userId}}"
  X-User-Role: USER
body:
  type: json
  content: |-
    {
      "title": "권한 없음",
      "startsAt": "2027-12-01T07:00:00Z",
      "endsAt": "2027-12-01T07:30:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 응답', () => pm.response.to.have.status(403));
      pm.test('code = FORBIDDEN', () => pm.expect(pm.response.json().code).to.eql('FORBIDDEN'));
    language: text/javascript
order: 18000
