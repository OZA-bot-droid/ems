$kind: http-request
url: "{{baseUrl}}/events/999999999"
method: GET
headers:
  X-Member-Id: "{{adminId}}"
  X-User-Role: ADMIN
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 응답', () => pm.response.to.have.status(404));
      pm.test('code = EVENT_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('EVENT_NOT_FOUND'));
    language: text/javascript
order: 8000
