$kind: http-request
url: "{{baseUrl}}/events"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "exception",
      "description": "test를 위한 세미나",
      "capacity": 79,
      "startsAt": "2027-11-20T09:00:00Z",
      "endsAt": "2027-11-20T08:00:00Z",
      "meetingUrl": "https://meet.example.com/test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 응답', () => pm.response.to.have.status(400));
      pm.test('code = INVALID_PERIOD', () => pm.expect(pm.response.json().code).to.eql('INVALID_PERIOD'));
    language: text/javascript
order: 1000
