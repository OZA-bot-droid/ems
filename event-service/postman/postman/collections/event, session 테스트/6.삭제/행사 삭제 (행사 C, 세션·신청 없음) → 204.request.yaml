$kind: http-request
url: "{{baseUrl}}/events/{{eventC}}"
method: DELETE
headers:
  Content-Type: application/json
  X-Member-Id: "{{adminId}}"
  X-User-Role: ADMIN
scripts:
  - type: afterResponse
    code: pm.test('204 응답', () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
