server:
  port: 8081
spring:
  application:
    name: member-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/member_db}
    username: ${DB_USER:member_app}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
  # Bootstrap: no business tables or entities on main yet.
  # Set ddl-auto: validate in each service's Entity + V1 migration PR.
  jpa:
    # Hibernate는 테이블을 변경하지 않고 검증
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # 스키마 생성/변경은 Flyway가 담당
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # validate-on-migrate는 통상 기본 true이지만 정책 가독성을 위해 명시
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:   # 어떤 OAuth 서비스를 사용할지 등록하는 부분
          google:
            # 개발시 해당 비밀키는 오른쪽 위 down button 클릭 후 Edit configurations... => 해당 플젝 지정 => modify options => Environment variables 클릭 => 생성 및 입력
            # 배포시 해당 비밀키는 .env나 서버/클라우드 Secret 설정에 넣고 실행
            client-id: ${GOOGLE_CLIENT_ID}          # 어떤 애플리케이션이 로그인 요청을 했는지를 식별하는 값
            client-secret: ${GOOGLE_CLIENT_SECRET}  # Google에서 발급받은 비밀 키
            redirect-uri: "http://localhost:8080/api/login/oauth2/code/google"
            scope:      # 사용자 정보 중 어떤 정보를 요청할지 지정하는 부분
              - openid  # OIDC 로그인 사용
              - profile # 이름, 프로필 같은 기본 정보
              - email   # email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code  # 현재 사용하는 방식이 OAuth 방식이 Authorization Code 방식이라는 뜻
            redirect-uri: "http://localhost:8080/api/login/oauth2/code/naver"
            client-name: Naver  # OAuth 클라이언트를 사람이 보기 좋게 표시하는 이름

        # Google은 Spring Security가 기본 Provider 설정을 이미 알고 있으니 작성x
        provider:
          # Naver OAuth 서버의 실제 주소들을 알려주는 부분
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # Naver 로그인 페이지로 보내는 주소
            token-uri: https://nid.naver.com/oauth2.0/token             # Naver에서 받은 authorization code를 Access Token으로 바꿀 때 사용하는 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me          # 발급받은 Naver Access Token으로 회원 정보를 조회하는 주소
            user-name-attribute: response                               # 사용자 정보의 핵심 영역은 response영역에 있다는 것을 알려주는 부분
management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  private-key: C:/Dev/keys/private_key.pem
  public-key: C:/Dev/keys/public_key.pem
  issuer: ems-auth
  access-token-expiration: 1800
  refresh-token-expiration: 604800