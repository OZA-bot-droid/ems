server:
  port: 8081
spring:
  application:
    name: member-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/member_db}
    username: ${DB_USER:member_app}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
  # Bootstrap: no business tables or entities on main yet.
  # Set ddl-auto: validate in each service's Entity + V1 migration PR.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
