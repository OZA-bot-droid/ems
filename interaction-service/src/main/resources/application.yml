server:
  port: 8083
spring:
  application:
    name: interaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interaction_db}
    username: ${DB_USER:interaction_app}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
management:
  endpoints:
    web:
      exposure:
        include: health,info
